name: Release

# Pushing a tag like v1.0.0 builds the app and attaches CapsNumber.app.zip to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build universal app
        run: ./build.sh

      - name: Self-test
        run: build/CapsNumber.app/Contents/MacOS/CapsNumber --self-test

      - name: Package
        run: ditto -c -k --keepParent build/CapsNumber.app CapsNumber.app.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" CapsNumber.app.zip \
            --title "CapsNumber $GITHUB_REF_NAME" \
            --generate-notes
